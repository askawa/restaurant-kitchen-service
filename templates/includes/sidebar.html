<div class="sidebar-content d-flex flex-column h-100 p-3">
  <a
      href="{% url 'kitchen:index' %}"
      class="sidebar-brand text-decoration-none mb-4"
  >
    <span class="fs-4 fw-semibold">Kitchen Service</span>
    <small class="d-block">Restaurant management</small>
  </a>

  <ul class="nav nav-pills flex-column gap-1">
    <li class="nav-item">
      <a
          class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
          href="{% url 'kitchen:index' %}"
      >Dashboard</a>
    </li>
    <li class="nav-item">
      <a
          class="nav-link {% if 'dish-' in request.resolver_match.url_name and 'dish-type' not in request.resolver_match.url_name %}active{% endif %}"
          href="{% url 'kitchen:dish-list' %}"
      >Dishes</a>
    </li>
    <li class="nav-item">
      <a
          class="nav-link {% if 'dish-type' in request.resolver_match.url_name %}active{% endif %}"
          href="{% url 'kitchen:dish-type-list' %}"
      >Dish types</a>
    </li>
    <li class="nav-item">
      <a
          class="nav-link {% if 'ingredient' in request.resolver_match.url_name %}active{% endif %}"
          href="{% url 'kitchen:ingredient-list' %}"
      >Ingredients</a>
    </li>
    <li class="nav-item">
      <a
          class="nav-link {% if 'cook-' in request.resolver_match.url_name %}active{% endif %}"
          href="{% url 'kitchen:cook-list' %}"
      >Cooks</a>
    </li>
  </ul>

  <div class="mt-auto pt-4 border-top border-secondary">
    {% if user.is_authenticated %}
      <p class="small mb-2 text-light">
        Signed in as <strong>{{ user.username }}</strong>
      </p>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="btn btn-outline-light btn-sm w-100" type="submit">
          Log out
        </button>
      </form>
    {% else %}
      <a class="btn btn-outline-light btn-sm w-100" href="{% url 'login' %}">
        Log in
      </a>
    {% endif %}
  </div>
</div>
